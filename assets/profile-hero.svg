<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Aparijit Chakraborty — From Signals to Systems</title>
  <desc id="desc">A dark, modern engineering banner with signal waveforms, connected model nodes, and data visualisations representing applied AI, machine learning, and analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="0.56" stop-color="#101323"/>
      <stop offset="1" stop-color="#08151d"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6b4fe8" stop-opacity=".23"/>
      <stop offset="1" stop-color="#6b4fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="45%" r="65%">
      <stop offset="0" stop-color="#10b7c7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#10b7c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset=".56" stop-color="#54d5df"/>
      <stop offset="1" stop-color="#f2b66d"/>
    </linearGradient>
    <linearGradient id="lineViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e78ff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#8e78ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8e78ff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="lineCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d4df" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#45d4df" stop-opacity=".95"/>
      <stop offset="1" stop-color="#45d4df" stop-opacity=".2"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#aab5d3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#violetGlow)"/>
  <rect width="1280" height="360" rx="18" fill="url(#cyanGlow)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>

  <!-- Ambient technical geometry -->
  <g fill="none" stroke="#8791b8" stroke-opacity=".12">
    <circle cx="1090" cy="176" r="138" stroke-dasharray="3 10"/>
    <circle cx="1090" cy="176" r="105" stroke-dasharray="1 8"/>
    <path d="M760 18V340M780 18V340M800 18V340" stroke-opacity=".045"/>
    <path d="M30 292H1250" stroke-opacity=".08"/>
  </g>
  <g fill="#9b8cff" opacity=".55">
    <circle cx="1015" cy="46" r="1.8"/><circle cx="1184" cy="80" r="1.2"/><circle cx="1147" cy="286" r="1.5"/>
    <circle cx="870" cy="301" r="1.4"/><circle cx="1232" cy="220" r="1.2"/><circle cx="941" cy="24" r="1.3"/>
  </g>

  <!-- Header metadata -->
  <g font-family="'Segoe UI', Arial, sans-serif" fill="#98a0b7">
    <text x="56" y="44" font-size="11" letter-spacing="2.4">PERSONAL ENGINEERING LOG</text>
    <text x="1222" y="44" text-anchor="end" font-size="11" letter-spacing="2.2">AP / 001</text>
  </g>
  <path d="M56 60H1224" stroke="#7c83a4" stroke-opacity=".25"/>
  <path d="M56 60H265" stroke="url(#accent)" stroke-width="2.2"/>

  <!-- Main identity -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="58" y="123" fill="#f5f6fb" font-size="42" font-weight="700" letter-spacing="-.9">APARIJIT</text>
    <text x="58" y="169" fill="#f5f6fb" font-size="42" font-weight="700" letter-spacing="-.9">CHAKRABORTY<tspan fill="#9b8cff">.</tspan></text>
    <rect x="59" y="188" width="56" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="59" y="220" fill="#cbd0df" font-size="14" letter-spacing="1.15">COMPUTER SCIENCE ENGINEER</text>
    <text x="59" y="247" fill="#8791aa" font-size="12.5" letter-spacing="1.15">APPLIED AI / ML  <tspan fill="#525d78">•</tspan>  DATA ANALYTICS  <tspan fill="#525d78">•</tspan>  SOFTWARE</text>
    <text x="59" y="294" fill="#f3b66d" font-size="22" font-weight="600" letter-spacing=".55">FROM SIGNALS TO SYSTEMS</text>
    <text x="60" y="319" fill="#8791aa" font-size="11.5" letter-spacing=".6">Turning complex data into practical, trustworthy intelligence.</text>
  </g>

  <!-- Divider -->
  <path d="M700 86V320" stroke="#7e88a8" stroke-opacity=".26"/>
  <path d="M700 86V151" stroke="url(#accent)" stroke-width="2"/>

  <!-- Right visual: signal -> model -> insight -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="744" y="91" fill="#a9b1c7" font-size="10.5" letter-spacing="2.2">A SIMPLE MODEL OF HOW I BUILD</text>
    <text x="744" y="117" fill="#eef0f8" font-size="17" font-weight="600" letter-spacing=".4">SIGNAL  →  MODEL  →  INSIGHT</text>
  </g>

  <!-- Connecting rails -->
  <path d="M832 202H895M1018 202H1080" stroke="#64708d" stroke-width="1.4" stroke-dasharray="4 5"/>
  <path d="M832 202H895" stroke="url(#lineViolet)" stroke-width="2.2" filter="url(#softGlow)"/>
  <path d="M1018 202H1080" stroke="url(#lineCyan)" stroke-width="2.2" filter="url(#softGlow)"/>
  <g fill="#cad1e6"><path d="M888 197L895 202L888 207Z"/><path d="M1073 197L1080 202L1073 207Z"/></g>

  <!-- Signal card -->
  <g filter="url(#shadow)">
    <rect x="744" y="145" width="88" height="116" rx="12" fill="#151a2a" stroke="#8e78ff" stroke-opacity=".44"/>
    <rect x="756" y="158" width="23" height="16" rx="4" fill="#8e78ff" fill-opacity=".16" stroke="#9b8cff" stroke-opacity=".5"/>
    <text x="767.5" y="169.5" text-anchor="middle" fill="#b9adff" font-family="Arial,sans-serif" font-size="8" font-weight="700">01</text>
    <path d="M755 211H764L770 198L777 226L784 205L790 211H821" fill="none" stroke="#aa9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M755 233H821" stroke="#68718a" stroke-opacity=".35"/>
    <text x="788" y="248" fill="#b9c0d3" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">SIGNALS</text>
  </g>

  <!-- Model card with neural connections -->
  <g filter="url(#shadow)">
    <rect x="895" y="145" width="123" height="116" rx="12" fill="#151d2b" stroke="#4bd0db" stroke-opacity=".44"/>
    <rect x="907" y="158" width="23" height="16" rx="4" fill="#45d4df" fill-opacity=".14" stroke="#45d4df" stroke-opacity=".48"/>
    <text x="918.5" y="169.5" text-anchor="middle" fill="#80e4e9" font-family="Arial,sans-serif" font-size="8" font-weight="700">02</text>
    <g stroke="#45d4df" stroke-opacity=".48" stroke-width="1.1" fill="none">
      <path d="M918 193L943 187L971 196L995 185M918 193L943 216L971 196L995 222M918 239L943 216L971 226L995 222M943 187L943 216L971 226M971 196L971 226"/>
    </g>
    <g fill="#a3f0ee" stroke="#45d4df" stroke-width="1.1">
      <circle cx="918" cy="193" r="3.6"/><circle cx="918" cy="239" r="3.6"/><circle cx="943" cy="187" r="3.6"/>
      <circle cx="943" cy="216" r="4.1"/><circle cx="971" cy="196" r="4.2"/><circle cx="971" cy="226" r="3.6"/>
      <circle cx="995" cy="185" r="3.4"/><circle cx="995" cy="222" r="3.8"/>
    </g>
    <text x="956.5" y="248" fill="#b9c0d3" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">MODELS</text>
  </g>

  <!-- Insight card -->
  <g filter="url(#shadow)">
    <rect x="1080" y="145" width="144" height="116" rx="12" fill="#151d2b" stroke="#e6ac6d" stroke-opacity=".42"/>
    <rect x="1092" y="158" width="23" height="16" rx="4" fill="#e6ac6d" fill-opacity=".14" stroke="#e6ac6d" stroke-opacity=".48"/>
    <text x="1103.5" y="169.5" text-anchor="middle" fill="#f0c28d" font-family="Arial,sans-serif" font-size="8" font-weight="700">03</text>
    <path d="M1100 226V201H1113V226M1120 226V190H1133V226M1140 226V209H1153V226M1160 226V181H1173V226M1180 226V197H1193V226" fill="#e6ac6d" fill-opacity=".72" stroke="#f2c38f" stroke-width=".6"/>
    <path d="M1098 229H1207" stroke="#758099" stroke-opacity=".6"/>
    <text x="1152" y="248" fill="#b9c0d3" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">INSIGHTS</text>
  </g>

  <!-- Focus labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" letter-spacing=".7">
    <rect x="744" y="286" width="132" height="26" rx="13" fill="#8e78ff" fill-opacity=".10" stroke="#8e78ff" stroke-opacity=".35"/>
    <text x="810" y="303" text-anchor="middle" fill="#c3baff">GENERATIVE AI</text>
    <rect x="888" y="286" width="132" height="26" rx="13" fill="#45d4df" fill-opacity=".09" stroke="#45d4df" stroke-opacity=".34"/>
    <text x="954" y="303" text-anchor="middle" fill="#a5e9e9">PREDICTIVE ML</text>
    <rect x="1032" y="286" width="192" height="26" rx="13" fill="#e6ac6d" fill-opacity=".09" stroke="#e6ac6d" stroke-opacity=".32"/>
    <text x="1128" y="303" text-anchor="middle" fill="#f0c38f">DATA ANALYTICS</text>
  </g>

  <!-- Bottom signature line -->
  <path d="M56 339H1224" stroke="#7e88a8" stroke-opacity=".19"/>
  <circle cx="56" cy="339" r="2.3" fill="#9b8cff"/>
  <circle cx="1224" cy="339" r="2.3" fill="#45d4df"/>
</svg>
